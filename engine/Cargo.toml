[package]
name = "inference-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
half = "=2.7.1"
memmap2 = "=0.9.11"
minijinja = { version = "=2.24.0", features = ["json", "preserve_order", "fuel"] }
safetensors = { version = "=0.8.0", path = "vendor/safetensors", default-features = false, features = ["alloc"] }
sha2 = "=0.10.9"

tokenizers = { version = "=0.21.4", default-features = false, features = ["onig"] }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "net", "sync", "signal", "time", "macros"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
http-body-util = "=0.1.5"
futures = { version = "=0.3.34", default-features = false, features = ["std"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "=3.23.0"
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
jsonschema = { version = "=0.52.1", default-features = false }

[build-dependencies]
cc = "=1.4.7"

[features]
default = []
research-activation = []
native-ane = []
native-cuda = []
native-mlx = ["dep:mlx-sys"]
native-metal = []
native-fault-qualification = ["native-mlx"]
cuda-fault-qualification = ["native-cuda"]
cuda-q8-reference = ["native-cuda"]
cuda-arms-qualification = ["native-cuda"]
cuda-exl3-rotate-mutants = ["native-cuda"]
cuda-gdn-mutants = ["native-cuda"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-sys = { version = "=0.6.0", optional = true, default-features = false, features = ["accelerate", "metal"] }

# The filesystem-type lookup of `storage_guard` (safe `statfs`), and the
# per-arch open flags (`O_DIRECT`/`O_NOFOLLOW`) of the expert-bank disk
# envelope — the flag values differ between Linux archs, so they come from
# rustix's per-target tables; the process owner of the loopback key file.
# Already locked through `tempfile`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "process", "std"] }

# `getrandom` for the loopback key is a Linux and Android call in rustix; the other unix systems
# read the random device.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["rand"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
static_assertions = "=1.1.0"

[patch.crates-io]
mlx-sys = { path = "vendor/mlx-sys" }

[[bin]]
name = "enginesrv"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"
