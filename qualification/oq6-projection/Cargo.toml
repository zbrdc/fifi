[package]
name = "oq6-projection"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
inference-engine = { path = "../../engine", features = ["native-mlx"] }
serde_json = "=1.0.151"
# Offline pin: the Mac registry cache holds 0.8.57, matching the engine lock.
zerocopy = "=0.8.57"

[patch.crates-io]
mlx-sys = { path = "../../engine/vendor/mlx-sys" }

[lints.rust]
unsafe_code = "forbid"
