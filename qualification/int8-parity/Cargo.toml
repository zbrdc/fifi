[package]
name = "int8-parity-qualification"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
inference-engine = { path = "../../engine", features = ["native-mlx"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
half = "=2.7.1"

[dev-dependencies]
safetensors = { version = "=0.8.0", path = "../../engine/vendor/safetensors", default-features = false, features = ["alloc"] }

[patch.crates-io]
mlx-sys = { path = "../../engine/vendor/mlx-sys" }
