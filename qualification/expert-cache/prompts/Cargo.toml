[package]
name = "trace-prompts"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

# Tokenizes the T0 trace prompts with the engine tokenizer and the pinned chat template.
[dependencies]
inference-engine = { path = "../../../engine" }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
