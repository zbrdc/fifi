[package]
name = "dispatch-cost-qualification"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
inference-engine = { path = "../../engine", features = ["native-mlx", "native-fault-qualification"] }
