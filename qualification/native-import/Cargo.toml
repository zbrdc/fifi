[package]
name = "native-import-qualification"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
inference-engine = { path = "../../engine", features = ["native-mlx"] }
memmap2 = "=0.9.11"
mlx-sys = { version = "=0.6.0", default-features = false, features = ["accelerate", "metal"] }

[patch.crates-io]
mlx-sys = { path = "../../engine/vendor/mlx-sys" }
