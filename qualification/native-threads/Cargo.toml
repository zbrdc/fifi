[package]
name = "native-threads-qualification"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
crossbeam-channel = "=0.5.15"

[target.'cfg(target_os = "macos")'.dependencies]
inference-engine = { path = "../../engine", features = ["native-mlx"] }

[build-dependencies]
cc = "=1.4.7"

[patch.crates-io]
mlx-sys = { path = "../../engine/vendor/mlx-sys" }
