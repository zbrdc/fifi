# qualification/cuda-rd/Cargo.toml: own crate and own lockfile, like qualification/model-load and dispatch-cost.
[package]
name = "cuda-rd"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[[bin]]
name = "cuda-rd-run"
path = "src/main.rs"

# No [features]: the dependency below enables native-cuda, so build with plain `cargo build --release` (lane L, blocker 1).
[dependencies]
inference-engine = { path = "../../engine", features = ["native-cuda"] }
# Versions of cuda-p5 f449840 engine Cargo.lock: serde_json 1.0.151, sha2 0.10.9.
# The features are the ones the engine enables on serde_json (engine/Cargo.toml); declared here too, lock unchanged.
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
sha2 = "=0.10.9"

# The engine's own [patch] does not apply to a dependent crate; model-load and dispatch-cost repeat it (lane L, blocker 3).
[patch.crates-io]
mlx-sys = { path = "../../engine/vendor/mlx-sys" }

[lints.rust]
unsafe_code = "forbid"

# No [profile] override: `cargo build --release` is the only supported build (device-debug check, RD-10a5).
