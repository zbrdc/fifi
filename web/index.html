<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>fifi</title>
    <script>
      // Theme before first paint. store.ts owns the persisted value.
      try {
        var s = JSON.parse(localStorage.getItem("fifi-settings") || "{}");
        if (s.theme === "light" || s.theme === "dark")
          document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside id="sidebar" class="sidebar" aria-label="Sidebar">
        <div class="sidebar-head">
          <div class="brand"><span class="brand-mark" aria-hidden="true"></span>fifi</div>
          <button id="new-chat" class="btn-icon" type="button" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          </button>
        </div>
        <nav class="nav" aria-label="Views">
          <a href="#chat" data-view="chat">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
            <span>Chat</span>
          </a>
          <a href="#monitor" data-view="monitor">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6h5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
            <span>Monitor</span>
          </a>
          <a href="#about" data-view="about">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.1" fill="currentColor"/></svg>
            <span>About</span>
          </a>
        </nav>
        <div class="list-head" id="chat-list-head">Chats</div>
        <ul id="chat-list" class="chat-list"></ul>
      </aside>
      <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>
      <div class="content">
        <header class="toolbar">
          <button id="sidebar-toggle" class="btn-icon only-narrow" type="button" aria-label="Show sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          </button>
          <h1 id="view-title" class="view-title">Chat</h1>
          <div class="toolbar-spacer"></div>
          <button id="drawer-button" class="btn-icon" type="button" title="Sampling settings" aria-label="Sampling settings" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 8h10M18 8h2M4 16h2M10 16h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="16" cy="8" r="2.2" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="8" cy="16" r="2.2" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
          </button>
          <select id="model-picker" class="model-picker" aria-label="Model"></select>
          <div id="status-pill" class="pill pill-offline">
            <span class="dot" aria-hidden="true"></span><span id="status-label">Offline</span>
          </div>
        </header>
        <main id="main" class="main">
          <section id="view-chat" class="view view-chat" aria-label="Chat">
            <div id="chat-scroll" class="chat-scroll">
              <div id="chat-column" class="chat-column"></div>
            </div>
            <div class="composer-wrap">
              <div class="composer">
                <textarea id="composer-input" rows="1" placeholder="Message the model" aria-label="Message"></textarea>
                <button id="send-button" class="send" type="button" aria-label="Send" disabled>
                  <svg id="send-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                  <svg id="stop-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" hidden><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
                </button>
              </div>
              <div class="composer-hint">Enter sends. Shift+Enter adds a line.</div>
            </div>
          </section>
          <section id="view-monitor" class="view" aria-label="Monitor" hidden></section>
          <section id="view-about" class="view" aria-label="About" hidden></section>
        </main>
      </div>
    </div>
    <div id="drawer-root"></div>
    <div id="live-region" class="sr-only" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
